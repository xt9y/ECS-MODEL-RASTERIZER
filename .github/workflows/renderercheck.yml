name: RendererCheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horse-renderercheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderercheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            xvfb \
            xorg-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            vulkan-validationlayers \
            libxrandr-dev \
            libjson-perl

      - name: Build and install SDL3
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL-build --parallel 2
          sudo cmake --install /tmp/SDL-build
          sudo ldconfig

      - name: Build and install SDL_shadercross
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/libsdl-org/SDL_shadercross.git /tmp/SDL_shadercross
          cd /tmp/SDL_shadercross

          cmake -P build-scripts/download-prebuilt-DirectXShaderCompiler.cmake

          cmake -S external/SPIRV-Cross -B /tmp/SPIRV-Cross-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSPIRV_CROSS_SHARED=ON \
            -DSPIRV_CROSS_STATIC=OFF
          cmake --build /tmp/SPIRV-Cross-build --parallel 2
          sudo cmake --install /tmp/SPIRV-Cross-build

          cmake -S . -B /tmp/SDL_shadercross-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDLSHADERCROSS_VENDORED=OFF \
            -DSDLSHADERCROSS_TESTS=OFF \
            -DSDLSHADERCROSS_SHARED=ON \
            -DSDLSHADERCROSS_STATIC=OFF \
            -DSDLSHADERCROSS_CLI=OFF \
            -DSDLSHADERCROSS_INSTALL=ON \
            -DSDLSHADERCROSS_INSTALL_RUNTIME=ON \
            -DDirectXShaderCompiler_ROOT="$PWD/external/DirectXShaderCompiler-binaries" \
            -Dspirv_cross_c_shared_ROOT=/usr/local/share/spirv_cross_c_shared
          cmake --build /tmp/SDL_shadercross-build --parallel 2
          sudo cmake --install /tmp/SDL_shadercross-build
          sudo ldconfig

      - name: Clone and install C-BuildSystem
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git /tmp/C-BuildSystem
          make -C /tmp/C-BuildSystem
          sudo make -C /tmp/C-BuildSystem install

      - name: Clone and install RendererCheck
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xt9y/RendererCheck.git /tmp/RendererCheck
          make -C /tmp/RendererCheck
          sudo make -C /tmp/RendererCheck install

      - name: Clone GAME systems
        run: |
          git clone --depth 1 --branch systems https://github.com/xt9y-org/GAME.git GAME

      - name: RendererCheck
        working-directory: GAME
        run: renderercheck run
